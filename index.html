<style>
*{box-sizing:border-box}
:root{
 --green:#12a56f;--green2:#078b5c;--green-soft:#e9fbf3;
 --blue:#2488ee;--blue-soft:#eaf5ff;--red:#ef5350;--red-soft:#fff0ef;
 --orange:#f6a623;--orange-soft:#fff6df;--purple:#9b5de5;--purple-soft:#f4edff;
 --ink:#14253b;--muted:#72839a;--line:#e5edf5;--bg:#f6fbff;--white:#fff;
}
html{background:var(--bg)}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:
 radial-gradient(circle at 12% 4%,#eaf9ff 0,transparent 28%),
 radial-gradient(circle at 92% 2%,#effff4 0,transparent 24%),var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.wrap{max-width:1160px;margin:auto;padding:22px 24px}
.top{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;min-height:72px}
.brand{font-weight:900;font-size:22px;display:flex;align-items:center;gap:10px;color:#10253a}
.brand:before{content:"📗";width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#dff9ea,#e8f4ff);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 0 0 1px #d9eee6}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 9px 30px rgba(45,84,117,.065)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:13px}
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:850;cursor:pointer;transition:.18s;letter-spacing:-.1px}
.btn:hover{transform:translateY(-1px);filter:saturate(1.04)}
.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;box-shadow:0 8px 20px rgba(18,165,111,.20)}
.soft{background:#eef8f5;color:#087b56}.danger{background:var(--red-soft);color:#d62e2e}
.muted{color:var(--muted);font-size:13px;line-height:1.55}
.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:7px;color:#53677e}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid #dce7f0;border-radius:13px;background:#fff;outline:none;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#66b7f6;box-shadow:0 0 0 3px #e5f4ff}
.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 8px}.tabs button{white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:#eef5fa;font-size:11px;font-weight:850}
.ok{background:#dcfae9;color:#087b4d}.warn{background:#fff2cf;color:#b46a00}.bad{background:#ffe7e5;color:#d53232}
.money{font-size:27px;font-weight:950;letter-spacing:-.8px}.item{padding:13px 0;border-bottom:1px solid #edf2f7}.item:last-child{border:0}
.modal{position:fixed;inset:0;background:rgba(17,34,52,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30;backdrop-filter:blur(5px)}
.modalbox{background:#fff;border-radius:24px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 28px 80px rgba(14,39,64,.24);border:1px solid #edf3f8}
.modalbox h3{margin:0 0 16px;font-size:21px}.modalbox h3:before{content:"";display:inline-block;width:5px;height:22px;border-radius:8px;background:linear-gradient(var(--green),var(--blue));vertical-align:-4px;margin-right:9px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14253b;color:#fff;padding:12px 16px;border-radius:12px;z-index:99;box-shadow:0 10px 30px #0003}
.checklist{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:13px;padding:9px;background:#fbfdff}
.link{color:#1680d9;text-decoration:none;cursor:pointer;font-weight:850}.sectiontitle{margin:4px 0 10px}.proof{max-width:240px;max-height:190px;border-radius:12px;margin-top:8px}.locked{opacity:.55;pointer-events:none}

/* MY CLASSES */

/* CLASS WORKSPACE */
.workspace-head{background:linear-gradient(135deg,#f7fffb,#eef8ff);border:1px solid #dcecf2;border-radius:22px;padding:18px 20px;margin:8px 0 12px;box-shadow:0 9px 28px rgba(49,90,120,.055)}

#nav .btn.primary{background:#dff8ea;color:#078653;box-shadow:none}
.page>h3,.page>.row h3{font-size:22px;margin:8px 0}
.page .grid .card{min-height:112px;position:relative;overflow:hidden}
.page .grid .card:nth-child(1){background:linear-gradient(135deg,#edf7ff,#fff)}
.page .grid .card:nth-child(2){background:linear-gradient(135deg,#f0fff5,#fff)}

.page>.card,.page>.grid{animation:fadein .18s ease}
#home>.card:nth-of-type(2){background:linear-gradient(135deg,#eafff2,#f5fbff)}
#children>.card,#funds>.card,#payments>.card,#report>.card,#settings>.card{transition:.18s}
#children>.card:hover,#funds>.card:hover,#payments>.card:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(45,84,117,.09)}
@keyframes fadein{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}

@media(max-width:760px){
 .wrap{padding:14px}.top .wrap{min-height:64px}.brand{font-size:18px}.brand:before{width:35px;height:35px;font-size:19px}

function previewNewCover(input){

        input.files?.[0];

    if(!file){
        return;
    }


    const url =
        URL.createObjectURL(file);


    let preview =
        document.querySelector(
            ".cover-preview"
        );


    preview.innerHTML = `

        <div
            id="coverPreviewBg"
            class="class-cover-bg"
            style="
                background-image:url('${url}');
            "
        ></div>

        <img
            id="coverPreviewImage"
            src="${url}"
        >

    `;


    updateCoverScale(
        document.getElementById(
            "coverScale"
        ).value
    );
}


function updateCoverScale(value){

    const img =
        document.getElementById(
            "coverPreviewImage"
        );

    if(img){

        img.style.transform =
            `scale(${value})`;
    }


    const text =
        document.getElementById(
            "coverScaleText"
        );

    if(text){

        text.textContent =
            Math.round(
                Number(value) * 100
            ) + "%";
    }
}
function updateCoverPosition(value){

    const img =
        document.getElementById(
            "coverPreviewImage"
        );

    if(img){
        img.style.objectPosition =
            `center ${value}%`;
    }

    const text =
        document.getElementById(
            "coverPosYText"
        );

    if(text){
        text.textContent =
            Math.round(Number(value)) + "%";
    }
}

async function saveClassCover(){

    const input =
        document.getElementById(
            "classCoverFile"
        );

    const file =
        input?.files?.[0];


    const scale =
        Number(
            document.getElementById(
                "coverScale"
            ).value
        );
const posY =
    Number(
        document.getElementById(
            "coverPosY"
        ).value
    );

    try{

        let imagePath =
            G.cover_image_path || null;


        /* =========================
           ШИНЭ ЗУРАГ БАЙВАЛ UPLOAD
        ========================= */

        if(file){

            if(
                file.size >
                5 * 1024 * 1024
            ){

                return toast(
                    "Зураг 5MB-аас бага байна."
                );
            }


            const ext =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const newPath =
                `${G.id}/cover-${Date.now()}.${ext}`;


            const {
                error: uploadError
            } =
                await sb
                    .storage
                    .from(
                        "class-covers"
                    )
                    .upload(
                        newPath,
                        file,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false
                        }
                    );


            if(uploadError){
                throw uploadError;
            }


            /* хуучин зураг */

            if(G.cover_image_path){

                await sb
                    .storage
                    .from(
                        "class-covers"
                    )
                    .remove([
                        G.cover_image_path
                    ]);
            }


            imagePath =
                newPath;
        }


        /* =========================
           GROUP UPDATE
        ========================= */

        const {
            data,
            error
        } =
            await sb
                .from("af_groups")
              .update({

    cover_image_path:
        imagePath,

    cover_image_scale:
        scale,

    cover_image_y:
        posY

})
                .eq(
                    "id",
                    G.id
                )
                .select()
                .single();


        if(error){
            throw error;
        }


        G = data;


        closeModal();

        home();


        toast(
            "Ангийн зураг хадгалагдлаа"
        );

    }
    catch(e){

        console.error(e);

        toast(
            e.message ||
            "Зураг хадгалахад алдаа гарлаа"
        );
    }
}

}
function report(){
 let rows=DATA.funds.map(f=>{let s=fstats(f);return{Фонд:f.title,Төрөл:f.kind==='monthly'?'Сарын':'Тусгай','Хүүхэд':s.count,'Төлсөн':s.paidCount,'Цугласан':s.paid,'Зарлага':s.exp,'Үлдэгдэл':s.balance,'Төлөв':f.status}});
 let total=rows.reduce((a,r)=>({in:a.in+r['Цугласан'],ex:a.ex+r['Зарлага'],bal:a.bal+r['Үлдэгдэл']}),{in:0,ex:0,bal:0});
 let months=DATA.funds.filter(f=>f.kind==='monthly').slice(-6);
 $('report').innerHTML=`<div class="row between"><h3>Тайлан</h3><span class="pill">${esc(G.academic_year)}</span></div>
 <div class="two"><div class="field"><label>Фонд</label><select><option>Сарын фонд</option><option>Бүх фонд</option></select></div><div class="field"><label>Сар</label><select><option>Бүгд</option>${months.map(f=>`<option>${esc(f.title)}</option>`).join('')}</select></div></div>
 <div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="statlabel">Нийт орлого</div><div class="statnum" style="color:#079b66">${money(total.in)}</div></div><div class="card"><div class="statlabel">Нийт зарлага</div><div class="statnum" style="color:#ef4c55">${money(total.ex)}</div></div><div class="card"><div class="statlabel">Үлдэгдэл</div><div class="statnum" style="color:#147ce5">${money(total.bal)}</div></div></div>
 <div class="card"><b>Сарын төлөлтийн явц</b><div class="chart">${months.map(f=>{let st=fstats(f),pct=st.count?Math.round(st.paidCount/st.count*100):0;return `<div class="barcol"><div class="bar" style="height:${Math.max(8,pct)}px"></div>${esc(f.month_key||'')}</div>`}).join('')||'<span class="muted">Сарын фондын мэдээлэл алга.</span>'}</div></div>
 <div class="card report-links"><b>Дэлгэрэнгүй тайлан</b><div class="item">📘 Төлөлтийн жагсаалт <span style="float:right">›</span></div><div class="item">🧾 Зарлагын жагсаалт <span style="float:right">›</span></div><div class="item">🧒 Хүүхэд тус бүрийн төлөв <span style="float:right">›</span></div><div class="item">💚 Фондыг үлдэгдэл <span style="float:right">›</span></div>${M.role!=='parent'?`<div class="item" onclick="excelReport()">📗 Excel татах <span style="float:right">›</span></div><div class="item" onclick="pdfReport()">📄 PDF татах <span style="float:right">›</span></div>`:''}</div>`;
 DATA.reportRows=rows;
}function excelReport(){let ws=XLSX.utils.json_to_sheet(DATA.reportRows||[]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Тайлан');XLSX.writeFile(wb,`Angiin-fond-${G.academic_year}.xlsx`)}function pdfReport(){let{jsPDF}=window.jspdf,doc=new jsPDF();doc.text('Angiin fond report',14,16);doc.text(`${G.institution_name} / ${G.group_name} / ${G.academic_year}`,14,24);let y=34;(DATA.reportRows||[]).forEach(r=>{doc.text(`${r['Фонд']}: income ${r['Цугласан']}, expense ${r['Зарлага']}, balance ${r['Үлдэгдэл']}`,14,y);y+=8;if(y>280){doc.addPage();y=20}});doc.save(`Angiin-fond-${G.academic_year}.pdf`)}
function settings(){
 $('settings').innerHTML=`<h3>Тохиргоо</h3><div class="card">
 <div class="settings-item" onclick="settingsInfo()"><div class="settings-ico">🏫</div><div style="flex:1"><b>Ангийн мэдээлэл</b></div><b>›</b></div>
 <div class="settings-item" onclick="settingsBank()"><div class="settings-ico" style="background:#e8f5ff">🏦</div><div style="flex:1"><b>Фондын дансны мэдээлэл</b></div><b>›</b></div>
 <div class="settings-item" onclick="children()"><div class="settings-ico" style="background:#e9faef">👥</div><div style="flex:1"><b>Гишүүдийн хүсэлт</b></div>${DATA.requests.filter(x=>x.status==='pending').length?`<span class="pill bad">${DATA.requests.filter(x=>x.status==='pending').length}</span>`:''}<b>›</b></div>
 <div class="settings-item" onclick="funds()"><div class="settings-ico" style="background:#f4edff">⚙️</div><div style="flex:1"><b>Фондын тохиргоо</b></div><b>›</b></div>
 <div class="settings-item" onclick="ownerTransferInfo()"><div class="settings-ico" style="background:#fff0ef">👤</div><div style="flex:1"><b>Админ солих</b></div><b>›</b></div>
 <div class="settings-item" onclick="closeGroupInfo()" style="color:#e23d44"><div class="settings-ico" style="background:#fff0ef">🗑️</div><div style="flex:1"><b>Ангийг хаах</b></div><b>›</b></div></div>
 <div class="card">
    <b>🔗 Ангид урих</b>

    <div class="money">${esc(G.invite_code)}</div>

    <div class="row" style="margin-top:10px">
        <button class="btn soft"
            onclick="navigator.clipboard.writeText('${esc(G.invite_code)}');toast('Код хуулагдлаа')">
            Код хуулах
        </button>

        <button class="btn primary"
            onclick="copyInviteLink()">
            🔗 Урилгын линк хуулах
        </button>
    </div>
</div>`;
}
 function copyInviteLink(){
    if(!G?.invite_code) return toast('Урилгын код олдсонгүй');

    const link =
        location.origin +
        location.pathname +
        '?invite=' +
        encodeURIComponent(G.invite_code);

    navigator.clipboard.writeText(link);

    toast('Урилгын линк хуулагдлаа 🔗');
}
function settingsInfo(){modal(`<h3>Ангийн мэдээлэл</h3><div class="field"><label>Байгууллага</label><input value="${esc(G.institution_name)}" readonly></div><div class="field"><label>Анги / бүлэг</label><input value="${esc(G.group_name)}" readonly></div><div class="field"><label>Админы нэр</label><input id="an" value="${esc(G.admin_name||'')}"></div><div class="field"><label>Утас</label><input id="ap" maxlength="8" value="${esc(G.admin_phone||'')}"></div><div class="field"><label>Үүрэг</label><input id="at" value="${esc(G.admin_title||'')}"></div><button class="btn primary" style="width:100%" onclick="saveSettings()">Хадгалах</button>`)}
function settingsBank(){modal(`<h3>Фондын дансны мэдээлэл</h3><div class="field"><label>Банк</label><input id="bn" value="${esc(G.bank_name||'')}"></div><div class="field"><label>Данс</label><input id="ba" value="${esc(G.bank_account||'')}"></div><div class="field"><label>Данс эзэмшигч</label><input id="bh" value="${esc(G.bank_holder||'')}"></div><button class="btn primary" style="width:100%" onclick="saveBank()">Хадгалах</button>`)}
async function saveBank(){let row={bank_name:$('bn').value.trim(),bank_account:$('ba').value.trim(),bank_holder:$('bh').value.trim()};let{data,error}=await sb.from('af_groups').update(row).eq('id',G.id).select().single();if(error)return toast(error.message);G=data;closeModal();toast('Данс хадгалагдлаа')}
function ownerTransferInfo(){modal(`<h3>Админ солих</h3><p class="muted">Ownership шилжүүлэлт backend-д бэлэн. Шинэ админ эхлээд өөрийн аккаунтаар тухайн ангид гишүүн болсон байх шаардлагатай. Дараагийн production алхамд гишүүдээс сонгодог selector холбоно.</p><button class="btn soft" style="width:100%" onclick="closeModal()">Ойлголоо</button>`)}
function closeGroupInfo(){modal(`<h3 style="color:#e23d44">Ангийг хаах</h3><p class="muted">v1 дээр өгөгдөл санамсаргүй устахаас хамгаалж анги устгах үйлдлийг хаалттай үлдээсэн. Фонд бүрийг хааж, тайлангаа хадгална.</p><button class="btn soft" style="width:100%" onclick="closeModal()">Буцах</button>`)}
async function saveSettings(){let row={admin_name:$('an').value.trim(),admin_phone:$('ap').value.trim(),admin_title:$('at').value.trim()};let{data,error}=await sb.from('af_groups').update(row).eq('id',G.id).select().single();if(error)return toast(error.message);G=data;closeModal();toast('Хадгалагдлаа')}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT')location.reload()});document.addEventListener('DOMContentLoaded',boot);
</script></body></html>
