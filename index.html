<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ангийн фонд</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f8;color:#17202a}button,input,select,textarea{font:inherit}.hidden{display:none!important}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e3e8ee;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #0000000b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#13795b;color:#fff}.soft{background:#eaf7f2;color:#12664d}.danger{background:#fee2e2;color:#991b1b}.muted{color:#68727d;font-size:13px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d9e0e7;border-radius:11px;background:#fff}.top{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}.top .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:6px}.tabs button{white-space:nowrap}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f7;font-size:11px;font-weight:700}.ok{background:#dcfce7;color:#166534}.warn{background:#ffedd5;color:#9a3412}.bad{background:#fee2e2;color:#991b1b}.money{font-size:24px;font-weight:900}.item{padding:12px 0;border-bottom:1px solid #edf0f3}.item:last-child{border:0}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}.modalbox{background:#fff;border-radius:18px;padding:18px;max-width:600px;width:100%;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:10px;z-index:99}.checklist{max-height:240px;overflow:auto;border:1px solid #e5e7eb;border-radius:10px;padding:8px}.link{color:#13795b;text-decoration:underline;cursor:pointer}.sectiontitle{margin:4px 0 10px}.proof{max-width:220px;max-height:180px;border-radius:10px;margin-top:8px}.locked{opacity:.55;pointer-events:none}@media(max-width:600px){.wrap{padding:12px}.row.mobilecol{align-items:stretch;flex-direction:column}.btn{min-height:44px}}</style></head><body>
<div id="toast" class="toast hidden"></div>
<section id="auth" class="wrap" style="max-width:480px;padding-top:8vh"><div class="card"><h1>Ангийн фонд</h1><p class="muted">Анги, бүлгийн сангийн ил тод бүртгэл.</p><div class="tabs"><button class="btn primary" onclick="authTab('login')">Нэвтрэх</button><button class="btn soft" onclick="authTab('register')">Бүртгүүлэх</button></div><div id="loginBox"><div class="field"><label>Email</label><input id="le" type="email"></div><div class="field"><label>Нууц үг</label><input id="lp" type="password"></div><button class="btn primary" onclick="login()">Нэвтрэх</button></div><div id="registerBox" class="hidden"><div class="field"><label>Нэр</label><input id="rn"></div><div class="field"><label>Email</label><input id="re" type="email"></div><div class="field"><label>Нууц үг</label><input id="rp" type="password"></div><button class="btn primary" onclick="register()">Бүртгүүлэх</button></div></div></section>
<section id="app" class="hidden"><div class="top"><div class="wrap"><div class="brand">🐷 Ангийн фонд</div><button class="btn soft" onclick="logout()">Гарах</button></div></div><div class="wrap">
<div id="groupsView"><div class="row between"><div><h2>Миний анги / бүлгүүд</h2><div class="muted">Нэг account олон ангид өөр өөр role-той байж болно.</div></div><div class="row"><button class="btn primary" onclick="openCreateGroup()">＋ Анги / бүлэг үүсгэх</button><button class="btn soft" onclick="openJoin()">🔗 Нэгдэх</button></div></div><div id="groups"></div></div>
<div id="workspace" class="hidden"><div class="row between"><div><span class="link" onclick="backGroups()">← Миний ангиуд</span><h2 id="gTitle"></h2><div id="gSub" class="muted"></div></div><span id="role" class="pill"></span></div><div id="accessBanner" class="card"></div><div class="tabs" id="nav"><button class="btn primary" onclick="tab('home',this)">Нүүр</button><button class="btn soft admin" onclick="tab('children',this)">Хүүхэд</button><button class="btn soft" onclick="tab('funds',this)">Фонд</button><button class="btn soft" onclick="tab('payments',this)">Төлөлт</button><button class="btn soft" onclick="tab('report',this)">Тайлан</button><button class="btn soft admin" onclick="tab('settings',this)">Тохиргоо</button></div>
<div id="home" class="page"></div><div id="children" class="page hidden"></div><div id="funds" class="page hidden"></div><div id="payments" class="page hidden"></div><div id="report" class="page hidden"></div><div id="settings" class="page hidden"></div></div></div></section><div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="modalBody" class="modalbox"></div></div>
<script>
const SUPABASE_URL="https://fjvjtujwnbsonycgxuuu.supabase.co";const SUPABASE_KEY="sb_publishable_0QwVZZJsw_J0iHTov07o5A_ykK11Uai";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let U=null,G=null,M=null,DATA={};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('mn-MN').format(Number(n||0))+'₮';function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}function modal(h){$('modalBody').innerHTML=h;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function ay(){let d=new Date(),y=d.getFullYear();return d.getMonth()>=8?`${y}–${y+1}`:`${y-1}–${y}`}
function authTab(x){$('loginBox').classList.toggle('hidden',x!=='login');$('registerBox').classList.toggle('hidden',x!=='register')}async function register(){let n=$('rn').value.trim(),e=$('re').value.trim(),p=$('rp').value;if(!n||!e||p.length<6)return toast('Мэдээллээ бүрэн оруулна уу');let{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});if(error)return toast(error.message);toast(data.session?'Бүртгэгдлээ':'Email баталгаажуулна уу');if(data.session)boot()}async function login(){let{error}=await sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});if(error)return toast(error.message);boot()}async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){let{data:{session}}=await sb.auth.getSession();if(!session)return;$('auth').classList.add('hidden');$('app').classList.remove('hidden');U=session.user;loadGroups()}async function loadGroups(){G=M=null;$('groupsView').classList.remove('hidden');$('workspace').classList.add('hidden');let{data,error}=await sb.from('af_memberships').select('id,role,status,group_id,af_groups(*)').eq('user_id',U.id).eq('status','approved');if(error)return toast(error.message);$('groups').innerHTML=(data||[]).length?(data||[]).map((m,i)=>`<div class="card row between"><div><b>${esc(m.af_groups.group_name)}</b><div class="muted">${esc(m.af_groups.institution_name)} · ${esc(m.af_groups.academic_year)}</div></div><div><span class="pill">${m.role==='owner'?'Эзэмшигч':m.role==='admin'?'Админ':'Эцэг эх'}</span> <button class="btn soft" onclick='enter(${JSON.stringify(JSON.stringify(m))})'>Нээх</button></div></div>`).join(''):'<div class="card muted">Одоогоор анги / бүлэг алга.</div>'}
function openCreateGroup(){modal(`<h3>Анги / бүлэг үүсгэх</h3><div class="field"><label>Байгууллагын нэр</label><input id="ci" placeholder="23-р сургууль"></div><div class="field"><label>Анги / бүлгийн нэр</label><input id="cg" placeholder="5А"></div><div class="field"><label>Хичээлийн жил</label><input value="${ay()}" readonly></div><button class="btn primary" onclick="createGroup()">Үүсгэх</button>`)}async function createGroup(){let i=$('ci').value.trim(),g=$('cg').value.trim();if(!i||!g)return toast('Мэдээллээ бөглөнө үү');let{error}=await sb.rpc('af_create_group',{p_institution:i,p_group:g,p_year:ay()});if(error)return toast(error.message);closeModal();await loadGroups();toast('Анги үүслээ')}
function openJoin(){modal(`<h3>Урилгын код</h3><div class="field"><input id="jc" placeholder="Код"></div><button class="btn primary" onclick="findInvite()">Үргэлжлүүлэх</button>`)}async function findInvite(){let code=$('jc').value.trim();let{data,error}=await sb.rpc('af_find_invite',{p_code:code});if(error||!data?.length)return toast('Код олдсонгүй');let g=data[0];modal(`<h3>${esc(g.institution_name)} — ${esc(g.group_name)}</h3><p class="muted">${esc(g.academic_year)} · Хариуцагч: ${esc(g.admin_name||'—')} ${esc(g.admin_phone||'')}</p><div class="field"><label>Хүүхдийн овог, нэр</label><input id="ch"></div><h4>Үндсэн холбоо барих хүн</h4><div class="field"><input id="n1" placeholder="Нэр"></div><div class="field"><input id="p1" maxlength="8" placeholder="Утас"></div><div class="field"><select id="r1">${rels()}</select></div><h4>Нэмэлт холбоо барих хүн *</h4><div class="field"><input id="n2" placeholder="Нэр"></div><div class="field"><input id="p2" maxlength="8" placeholder="Утас"></div><div class="field"><select id="r2">${rels()}</select></div><button class="btn primary" onclick="submitChild('${esc(code)}')">Хүсэлт илгээх</button>`)}function rels(){return ['Аав','Ээж','Өвөө','Эмээ','Ах','Эгч','Асран хамгаалагч','Бусад'].map(x=>`<option>${x}</option>`).join('')}async function submitChild(code){let a=['ch','n1','p1','n2','p2'].map(x=>$(x).value.trim());if(a.some(x=>!x))return toast('Бүх шаардлагатай мэдээллийг бөглөнө үү');let{error}=await sb.rpc('af_submit_child_request',{p_code:code,p_child:a[0],p_n1:a[1],p_p1:a[2],p_r1:$('r1').value,p_n2:a[3],p_p2:a[4],p_r2:$('r2').value});if(error)return toast(error.message);closeModal();toast('Хүсэлт илгээгдлээ')}
async function enter(raw){M=JSON.parse(raw);G=M.af_groups;$('groupsView').classList.add('hidden');$('workspace').classList.remove('hidden');$('gTitle').textContent=G.group_name;$('gSub').textContent=G.institution_name+' · '+G.academic_year;$('role').textContent=M.role==='owner'?'Эзэмшигч':M.role==='admin'?'Админ':'Эцэг эх';document.querySelectorAll('.admin').forEach(x=>x.classList.toggle('hidden',M.role==='parent'));await refresh();tab('home',document.querySelector('#nav button'))}function backGroups(){loadGroups()}function tab(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('#nav button').forEach(x=>{x.classList.remove('primary');x.classList.add('soft')});if(b){b.classList.add('primary');b.classList.remove('soft')}render(id)}
function hasWrite(){return new Date(G.trial_ends_at)>new Date()||(G.access_ends_at&&new Date(G.access_ends_at)>new Date())}async function refresh(){let admin=M.role!=='parent';let qs=[sb.from('af_funds').select('*').eq('group_id',G.id).order('due_date'),sb.from('af_children').select('*').eq('group_id',G.id),sb.from('af_payment_requests').select('*,af_payment_allocations(*)').eq('group_id',G.id).order('created_at',{ascending:false})];if(admin)qs.push(sb.from('af_child_requests').select('*').eq('group_id',G.id).order('created_at',{ascending:false}));let r=await Promise.all(qs);DATA.funds=r[0].data||[];DATA.children=r[1].data||[];DATA.payments=r[2].data||[];DATA.requests=admin?(r[3].data||[]):[];let ids=DATA.funds.map(x=>x.id);DATA.fc=[];DATA.exp=[];DATA.trans=[];if(ids.length){let[a,b,c]=await Promise.all([sb.from('af_fund_children').select('*').in('fund_id',ids),sb.from('af_expenses').select('*').in('fund_id',ids),sb.from('af_transfers').select('*').in('from_fund_id',ids)]);DATA.fc=a.data||[];DATA.exp=b.data||[];DATA.trans=c.data||[]}renderAccess()}
function renderAccess(){let trial=new Date(G.trial_ends_at),active=hasWrite(),days=Math.max(0,Math.ceil((trial-new Date())/86400000));$('accessBanner').innerHTML=active?`<b>${G.access_ends_at&&new Date(G.access_ends_at)>new Date()?'✅ Эрх идэвхтэй':'🎁 Үнэгүй туршилт'}</b><div class="muted">${G.access_ends_at?'Дуусах: '+new Date(G.access_ends_at).toLocaleDateString() : days+' хоног үлдлээ'}</div>`:`<b>🔒 Туршилтын хугацаа дууссан</b><div class="muted">Мэдээлэл хадгалагдсан. Унших боломжтой, шинэ өөрчлөлт хийхийн тулд эрх авна.</div>`}
function render(id){if(id==='home')home();if(id==='children')children();if(id==='funds')funds();if(id==='payments')payments();if(id==='report')report();if(id==='settings')settings()}
function approvedPaid(f,c){return DATA.payments.filter(p=>p.child_id===c&&p.status==='approved').flatMap(p=>p.af_payment_allocations||[]).filter(a=>a.fund_id===f).reduce((s,a)=>s+Number(a.amount),0)}function fstats(f){let rows=DATA.fc.filter(x=>x.fund_id===f.id),target=rows.reduce((s,x)=>s+Number(x.target_amount),0),paid=rows.reduce((s,x)=>s+approvedPaid(f.id,x.child_id),0),exp=DATA.exp.filter(x=>x.fund_id===f.id).reduce((s,x)=>s+Number(x.amount),0);return{target,paid,exp,balance:Number(f.carry_in||0)+paid-exp,count:rows.length,paidCount:rows.filter(x=>approvedPaid(f.id,x.child_id)>=Number(x.target_amount)).length}}
function home(){let total=DATA.funds.reduce((s,f)=>s+fstats(f).paid,0),ex=DATA.funds.reduce((s,f)=>s+fstats(f).exp,0);$('home').innerHTML=`<div class="grid"><div class="card"><div class="muted">Хүүхэд</div><div class="money">${DATA.children.length}</div></div><div class="card"><div class="muted">Нийт орлого</div><div class="money">${money(total)}</div></div><div class="card"><div class="muted">Нийт зарлага</div><div class="money">${money(ex)}</div></div><div class="card"><div class="muted">Үлдэгдэл</div><div class="money">${money(total-ex)}</div></div></div><div class="card"><b>Идэвхтэй фондууд</b>${DATA.funds.filter(f=>f.status==='active').map(f=>`<div class="item"><b>${esc(f.title)}</b> — ${money(fstats(f).balance)}</div>`).join('')||'<p class="muted">Фонд алга.</p>'}</div>`}
function children(){$('children').innerHTML=`<div class="row between"><h3>Хүүхдүүд</h3></div><div class="card"><h4>Бүртгэлийн хүсэлтүүд</h4>${DATA.requests.filter(x=>x.status==='pending').map(r=>`<div class="item row between"><div><b>${esc(r.child_name)}</b><div class="muted">${esc(r.contact1_name)} ${esc(r.contact1_phone)} · ${esc(r.contact2_name)} ${esc(r.contact2_phone)}</div></div><div><button class="btn primary" onclick="reviewChild('${r.id}','approved')">Зөвшөөрөх</button> <button class="btn danger" onclick="reviewChild('${r.id}','rejected')">Татгалзах</button></div></div>`).join('')||'<div class="muted">Хүлээгдэж буй хүсэлт алга.</div>'}</div><div class="card">${DATA.children.map(c=>`<div class="item"><b>${esc(c.full_name)}</b></div>`).join('')||'<div class="muted">Хүүхэд алга.</div>'}</div>`}async function reviewChild(id,status){if(!hasWrite())return toast('Эрх дууссан');let{error}=await sb.rpc('af_review_child_request',{p_id:id,p_status:status});if(error)return toast(error.message);await refresh();children()}
function funds(){$('funds').innerHTML=`<div class="row between"><h3>Фондууд</h3>${M.role!=='parent'?`<div><button class="btn primary" onclick="fundModal()">＋ Фонд</button> <button class="btn soft" onclick="monthlyModal()">Сарын фонд</button></div>`:''}</div>${DATA.funds.map(f=>{let s=fstats(f);return `<div class="card"><div class="row between"><div><b>${esc(f.title)}</b> <span class="pill ${f.status==='closed'?'':'ok'}">${f.status==='closed'?'Хаасан':'Идэвхтэй'}</span><div class="muted">${money(f.amount_per_child)} / хүүхэд · ${f.due_date}</div></div><button class="btn soft" onclick="fundDetail('${f.id}')">Дэлгэрэнгүй</button></div><div class="grid"><div><span class="muted">Цугласан</span><br><b>${money(s.paid)}</b></div><div><span class="muted">Зарлага</span><br><b>${money(s.exp)}</b></div><div><span class="muted">Үлдэгдэл</span><br><b>${money(s.balance)}</b></div><div><span class="muted">Төлсөн</span><br><b>${s.paidCount}/${s.count}</b></div></div></div>`}).join('')||'<div class="card muted">Фонд алга.</div>'}`}
function fundModal(){if(!hasWrite())return toast('Эрх дууссан');modal(`<h3>Шинэ фонд</h3><div class="field"><label>Нэр</label><input id="ft"></div><div class="field"><label>Нэг хүүхдийн дүн</label><input id="fa" type="number"></div><div class="field"><label>Дуусах өдөр</label><input id="fd" type="date"></div><div class="field"><label>Тайлбар</label><textarea id="fdesc"></textarea></div><div class="field"><label>Хамрах хүрээ</label><select id="scope" onchange="$('pick').classList.toggle('hidden',this.value==='all')"><option value="all">Бүх хүүхэд</option><option value="selected">Сонгосон хүүхдүүд</option></select></div><div id="pick" class="checklist hidden">${DATA.children.map(c=>`<label><input type="checkbox" value="${c.id}"> ${esc(c.full_name)}</label><br>`).join('')}</div><button class="btn primary" onclick="saveFund('special')">Үүсгэх</button>`)}async function saveFund(kind,monthKey=null,titleOverride=null,dueOverride=null){let title=titleOverride||$('ft').value.trim(),amt=Number($('fa').value),due=dueOverride||$('fd').value,desc=titleOverride?'':$('fdesc').value.trim();if(!title||!amt||!due)return toast('Мэдээллээ бөглөнө үү');let bank={bank_name:G.bank_name,bank_account:G.bank_account,bank_holder:G.bank_holder};let{data:f,error}=await sb.from('af_funds').insert({group_id:G.id,title,kind,amount_per_child:amt,due_date:due,description:desc,month_key:monthKey,created_by:U.id,...bank}).select().single();if(error)return toast(error.message);let kids=titleOverride?DATA.children:($('scope').value==='all'?DATA.children:DATA.children.filter(c=>[...document.querySelectorAll('#pick input:checked')].some(x=>x.value===c.id)));if(!kids.length)return toast('Хүүхэд сонгоно уу');let{error:e}=await sb.from('af_fund_children').insert(kids.map(c=>({fund_id:f.id,child_id:c.id,target_amount:amt})));if(e)return toast(e.message);return f}
function monthlyModal(){if(!hasWrite())return toast('Эрх дууссан');modal(`<h3>Сарын үндсэн фонд</h3><div class="field"><label>Сар бүрийн дүн</label><input id="fa" type="number"></div><div class="field"><label>Эхлэх сар</label><input id="ms" type="month"></div><div class="field"><label>Дуусах сар</label><input id="me" type="month"></div><button class="btn primary" onclick="makeMonths()">Сарууд үүсгэх</button>`)}async function makeMonths(){let a=Number($('fa').value),s=$('ms').value,e=$('me').value;if(!a||!s||!e)return toast('Мэдээллээ бөглөнө үү');let d=new Date(s+'-01T00:00'),end=new Date(e+'-01T00:00');if(d>end)return toast('Сарын дараалал буруу');while(d<=end){let mk=d.toISOString().slice(0,7),m=d.getMonth()+1,last=new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);let exists=DATA.funds.some(f=>f.month_key===mk);if(!exists){let fake={value:a};window.fa=fake;await saveFund('monthly',mk,`${m}-р сарын ангийн фонд`,last)}d.setMonth(d.getMonth()+1)}closeModal();await refresh();funds();toast('Сарын фондууд үүслээ')}
async function fundDetail(id){let f=DATA.funds.find(x=>x.id===id),s=fstats(f),rows=DATA.fc.filter(x=>x.fund_id===id);let childRows=rows.map(x=>{let c=DATA.children.find(z=>z.id===x.child_id),p=approvedPaid(id,x.child_id),rem=Math.max(0,Number(x.target_amount)-p);return `<div class="item row between"><span>${esc(c?.full_name||'')}</span><span class="pill ${rem===0?'ok':p?'warn':'bad'}">${money(p)} / ${money(x.target_amount)}</span></div>`}).join('');let ex=DATA.exp.filter(x=>x.fund_id===id).map(x=>`<div class="item"><b>${esc(x.title)}</b> — ${money(x.amount)}<div class="muted">${x.expense_date} ${esc(x.description||'')}</div></div>`).join('');modal(`<h3>${esc(f.title)}</h3><div class="grid"><div><span class="muted">Цугласан</span><br><b>${money(s.paid)}</b></div><div><span class="muted">Зарлага</span><br><b>${money(s.exp)}</b></div><div><span class="muted">Үлдэгдэл</span><br><b>${money(s.balance)}</b></div></div>${M.role!=='parent'?`<h4>Хүүхэд бүр</h4>${childRows}<button class="btn primary" onclick="expenseModal('${id}')">＋ Зарлага</button> ${f.status==='active'?`<button class="btn soft" onclick="closeFund('${id}')">Фонд хаах</button>`:''}`:''}<h4>Зарлага</h4>${ex||'<div class="muted">Зарлага алга.</div>'}`)}
function expenseModal(fid){modal(`<h3>Зарлага нэмэх</h3><div class="field"><label>Зарлагын нэр *</label><input id="et"></div><div class="field"><label>Дүн *</label><input id="ea" type="number"></div><div class="field"><label>Огноо *</label><input id="ed" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Тайлбар</label><textarea id="edes"></textarea></div><div class="field"><label>Зураг / баримт *</label><input id="ep" type="file" accept="image/*"></div><button class="btn primary" onclick="saveExpense('${fid}')">Хадгалах</button>`)}async function upload(file,prefix){let path=`${U.id}/${prefix}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let{error}=await sb.storage.from('af-proofs').upload(path,file);if(error)throw error;return path}async function saveExpense(fid){if(!hasWrite())return toast('Эрх дууссан');let file=$('ep').files[0];if(!$('et').value.trim()||!Number($('ea').value)||!$('ed').value||!file)return toast('Нэр, дүн, огноо, зураг заавал');try{let p=await upload(file,'expense');let{error}=await sb.from('af_expenses').insert({fund_id:fid,title:$('et').value.trim(),amount:Number($('ea').value),expense_date:$('ed').value,description:$('edes').value.trim(),proof_path:p,created_by:U.id});if(error)throw error;closeModal();await refresh();fundDetail(fid)}catch(e){toast(e.message)}}
async function closeFund(fid){if(!hasWrite())return toast('Эрх дууссан');let f=DATA.funds.find(x=>x.id===fid),bal=fstats(f).balance,targets=DATA.funds.filter(x=>x.id!==fid&&x.status==='active'&&(f.kind==='special'?x.kind==='monthly':x.kind==='monthly'&&x.due_date>f.due_date)).sort((a,b)=>a.due_date.localeCompare(b.due_date));modal(`<h3>Фонд хаах</h3><p>Үлдэгдэл: <b>${money(bal)}</b></p><div class="field"><label>Үлдэгдэл шилжүүлэх фонд</label><select id="to"><option value="">Шилжүүлэхгүй</option>${targets.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></div><button class="btn primary" onclick="doClose('${fid}',${bal})">Хаах</button>`)}async function doClose(fid,bal){let to=$('to').value;if(to&&bal>0){let t=DATA.funds.find(x=>x.id===to);await sb.from('af_funds').update({carry_in:Number(t.carry_in||0)+bal}).eq('id',to);await sb.from('af_transfers').insert({from_fund_id:fid,to_fund_id:to,amount:bal,note:'Хаалтын үлдэгдэл',created_by:U.id})}let{error}=await sb.from('af_funds').update({status:'closed',closed_at:new Date().toISOString()}).eq('id',fid);if(error)return toast(error.message);closeModal();await refresh();funds()}
function myChildren(){return DATA.children.filter(c=>DATA.fc.some(fc=>fc.child_id===c.id))}function payments(){if(M.role!=='parent'){$('payments').innerHTML=`<h3>Төлөлтийн хүсэлтүүд</h3>${DATA.payments.filter(x=>x.status==='pending').map(p=>{let c=DATA.children.find(x=>x.id===p.child_id);return `<div class="card row between"><div><b>${esc(c?.full_name||'')}</b> — ${money(p.total_amount)}<div class="muted">${new Date(p.created_at).toLocaleString()}</div></div><div><button class="btn primary" onclick="reviewPay('${p.id}','approved')">Зөвшөөрөх</button> <button class="btn danger" onclick="reviewPay('${p.id}','rejected')">Татгалзах</button></div></div>`}).join('')||'<div class="card muted">Хүлээгдэж буй төлөлт алга.</div>'}`;return}$('payments').innerHTML=`<div class="row between"><h3>Миний төлөлт</h3><button class="btn primary" onclick="payModal()">Төлөлт хийх</button></div><div class="card muted">Төлөлт нь нэг хүүхэд + нэг хүлээн авах дансаар багцлагдана. Админ банкны гүйлгээг шалгаж батална.</div>`}
async function reviewPay(id,status){if(!hasWrite())return toast('Эрх дууссан');let{error}=await sb.rpc('af_approve_payment',{p_id:id,p_status:status});if(error)return toast(error.message);await refresh();payments()}
function payModal(){let kids=myChildren();modal(`<h3>Төлөлт хийх</h3><div class="field"><label>Хүүхэд</label><select id="pc" onchange="payOptions()">${kids.map(c=>`<option value="${c.id}">${esc(c.full_name)}</option>`).join('')}</select></div><div id="payOpts"></div>`);payOptions()}function payOptions(){let cid=$('pc').value,fs=DATA.funds.filter(f=>f.status==='active'&&DATA.fc.some(x=>x.fund_id===f.id&&x.child_id===cid&&approvedPaid(f.id,cid)<Number(x.target_amount)));let groups={};fs.forEach(f=>{let k=(f.bank_name||G.bank_name||'')+'|'+(f.bank_account||G.bank_account||'');(groups[k]??=[]).push(f)});$('payOpts').innerHTML=Object.entries(groups).map(([k,arr],i)=>{let[b,a]=k.split('|');return `<div class="card"><b>${esc(b||'Данс тохируулаагүй')} ${esc(a||'')}</b>${arr.map(f=>{let fc=DATA.fc.find(x=>x.fund_id===f.id&&x.child_id===cid),rem=Number(fc.target_amount)-approvedPaid(f.id,cid);return `<label class="item"><input class="pf" data-bank="${esc(k)}" data-fund="${f.id}" data-max="${rem}" type="checkbox"> ${esc(f.title)} — ${money(rem)}</label>`}).join('')}<button class="btn primary" onclick="paymentForm('${esc(k)}')">Энэ дансанд төлөх</button></div>`}).join('')||'<div class="muted">Төлөх үлдэгдэл алга.</div>'}
function paymentForm(k){let sel=[...document.querySelectorAll('.pf:checked')].filter(x=>x.dataset.bank===k);if(!sel.length)return toast('Фонд сонгоно уу');let total=sel.reduce((s,x)=>s+Number(x.dataset.max),0);modal(`<h3>Шилжүүлэг</h3><p>Нийт: <b>${money(total)}</b></p><div class="field"><label>Гүйлгээний баримт *</label><input id="pp" type="file" accept="image/*"></div><button class="btn primary" onclick='submitPay(${JSON.stringify(JSON.stringify({k,cid:$('pc').value,items:sel.map(x=>({fund:x.dataset.fund,amount:Number(x.dataset.max)}))}))})'>Шалгуулах</button>`)}async function submitPay(raw){let x=JSON.parse(raw),file=$('pp').files[0];if(!file)return toast('Баримт заавал');try{let proof=await upload(file,'payment'),[bank,account]=x.k.split('|'),total=x.items.reduce((s,a)=>s+a.amount,0);let{data:p,error}=await sb.from('af_payment_requests').insert({group_id:G.id,child_id:x.cid,submitted_by:U.id,bank_name:bank,bank_account:account,total_amount:total,proof_path:proof}).select().single();if(error)throw error;let r=await sb.from('af_payment_allocations').insert(x.items.map(a=>({payment_request_id:p.id,fund_id:a.fund,amount:a.amount})));if(r.error)throw r.error;closeModal();toast('Төлөлт шалгуулахаар илгээгдлээ')}catch(e){toast(e.message)}}
function report(){let rows=DATA.funds.map(f=>{let s=fstats(f);return{Фонд:f.title,Төрөл:f.kind==='monthly'?'Сарын':'Тусгай','Хүүхэд':s.count,'Төлсөн':s.paidCount,'Цугласан':s.paid,'Зарлага':s.exp,'Үлдэгдэл':s.balance,'Төлөв':f.status}});let total=rows.reduce((a,r)=>({in:a.in+r['Цугласан'],ex:a.ex+r['Зарлага'],bal:a.bal+r['Үлдэгдэл']}),{in:0,ex:0,bal:0});$('report').innerHTML=`<div class="row between"><h3>Тайлан — ${esc(G.academic_year)}</h3>${M.role!=='parent'?'<div><button class="btn soft" onclick="excelReport()">Excel</button> <button class="btn soft" onclick="pdfReport()">PDF</button></div>':''}</div><div class="grid"><div class="card"><span class="muted">Цугласан</span><div class="money">${money(total.in)}</div></div><div class="card"><span class="muted">Зарлага</span><div class="money">${money(total.ex)}</div></div><div class="card"><span class="muted">Үлдэгдэл</span><div class="money">${money(total.bal)}</div></div></div>${rows.map(r=>`<div class="card"><b>${esc(r.Фонд)}</b><div class="muted">${r.Төлсөн}/${r.Хүүхэд} төлсөн · Орлого ${money(r.Цугласан)} · Зарлага ${money(r.Зарлага)} · Үлдэгдэл ${money(r.Үлдэгдэл)}</div></div>`).join('')}`;DATA.reportRows=rows}function excelReport(){let ws=XLSX.utils.json_to_sheet(DATA.reportRows||[]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Тайлан');XLSX.writeFile(wb,`Angiin-fond-${G.academic_year}.xlsx`)}function pdfReport(){let{jsPDF}=window.jspdf,doc=new jsPDF();doc.text('Angiin fond report',14,16);doc.text(`${G.institution_name} / ${G.group_name} / ${G.academic_year}`,14,24);let y=34;(DATA.reportRows||[]).forEach(r=>{doc.text(`${r['Фонд']}: income ${r['Цугласан']}, expense ${r['Зарлага']}, balance ${r['Үлдэгдэл']}`,14,y);y+=8;if(y>280){doc.addPage();y=20}});doc.save(`Angiin-fond-${G.academic_year}.pdf`)}
function settings(){$('settings').innerHTML=`<h3>Тохиргоо</h3><div class="card"><h4>Админы мэдээлэл</h4><div class="field"><label>Нэр</label><input id="an" value="${esc(G.admin_name||'')}"></div><div class="field"><label>Утас</label><input id="ap" maxlength="8" value="${esc(G.admin_phone||'')}"></div><div class="field"><label>Үүрэг / албан нэр</label><input id="at" value="${esc(G.admin_title||'')}"></div><h4>Ангийн үндсэн данс</h4><div class="field"><label>Банк</label><input id="bn" value="${esc(G.bank_name||'')}"></div><div class="field"><label>Данс</label><input id="ba" value="${esc(G.bank_account||'')}"></div><div class="field"><label>Данс эзэмшигч</label><input id="bh" value="${esc(G.bank_holder||'')}"></div><button class="btn primary" onclick="saveSettings()">Хадгалах</button></div><div class="card"><b>Урилгын код</b><div class="money">${esc(G.invite_code)}</div><button class="btn soft" onclick="navigator.clipboard.writeText('${esc(G.invite_code)}');toast('Код хуулагдлаа')">Хуулах</button></div><div class="card"><h4>Утас баталгаажуулалт</h4><p class="muted">Verify.mn production backend холбогдсоны дараа баталгаажсан дугаараар хүүхдүүд автоматаар холбогдоно. Browser-оос verified_phone-г шууд өөрчлөхийг зориуд хаасан.</p></div><div class="card"><h4>Эрхийн төлөвлөгөө</h4><p>1 сар — 8,900₮ · 5+1 сар — 34,900₮ · Бүтэн жил — 59,900₮</p><p class="muted">Subscription bank / Super Admin approval нь production тохиргооны хэсэг. Trial дуусахад энэ анги read-only болно.</p></div>`}async function saveSettings(){let row={admin_name:$('an').value.trim(),admin_phone:$('ap').value.trim(),admin_title:$('at').value.trim(),bank_name:$('bn').value.trim(),bank_account:$('ba').value.trim(),bank_holder:$('bh').value.trim()};let{data,error}=await sb.from('af_groups').update(row).eq('id',G.id).select().single();if(error)return toast(error.message);G=data;toast('Хадгалагдлаа')}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT')location.reload()});document.addEventListener('DOMContentLoaded',boot);
</script></body></html>
